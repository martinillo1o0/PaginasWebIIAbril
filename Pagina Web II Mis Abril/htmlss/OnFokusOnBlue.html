<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento onfokus y onblue</title>
</head>

<body onload="entrar()">
    <h1 id="titulo">Evento MouseOver y MouseOut</h1>
    <br>
    Nombre:   <input type="text" onfocus="cambiar(this)" outfocus="regresar(this)"/>
    Apellido: <input type="text" />
    <script>
        function cambiar(elementoInput) {
            elementoInput.style.background = 'yellow'

        }
        function regresar(elementoInput) {
            elementoInput.style.background = 'white'
        }

    </script>
</body>

</html>

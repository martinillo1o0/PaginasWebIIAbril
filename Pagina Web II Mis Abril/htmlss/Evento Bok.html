<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento bok</title>
</head>

<body onload="entrar()">
    <h1 id="titulo">Evento onload</h1>
    <br>
    <div id="mostrar"></div>

    <script>
        function entrar() {
            let texto = '';
            if (navigator.cookieEnabled) {
                texto = "Cookies estan habilitadas"

            } else {
                texto = "Las galletas no estan habilitadas."
            }
            document.getElementById('mostrar').innerHTML = texto;
        }

    </script>
</body>

</html>

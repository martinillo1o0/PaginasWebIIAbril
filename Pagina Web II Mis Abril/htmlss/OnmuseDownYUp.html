<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento mouse down y mouse Up</title>
</head>

<body onload="entrar()">
    <h1 id="titulo" onmousedown="rojo(this)" onmouseup="azul(this)">Evento MouseOver y MouseOut</h1>
    <br>
    <script>
        function rojo(titulo) {
            titulo.style.color = 'red';

        }
        function azul(titulo) {
            titulo.style.color = 'blue';
        }

    </script>
</body>

</html>

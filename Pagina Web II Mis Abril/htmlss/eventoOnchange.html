<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento Onechange</title>
</head>

<body onload="entrar()">
    <h1 id="titulo">Evento Onechange</h1>
    <br>
    <input type="text" onchange="convertir(this)" />

    <script>
        function convertir(nombreInput) {
            nombreInput.value = nombreInput.value.toUpperCase();
        }
    </script>
</body>

</html>

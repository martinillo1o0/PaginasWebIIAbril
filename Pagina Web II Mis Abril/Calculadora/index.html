<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Calculadora App</title>
</head>

<body>
    
    <div class="container">
        <h1 id="titulo">Calculadora</h1>
        <h2 id="tituloSuma">Suma</h2>
           <!-- Creamos el formulario nuevamente -->
        <form id="formulario">
            <div class="mb-3">
                   <!-- Usamos las medidas del Srpingboot --> 
                <label for="Operador1">Operador 1</label>
                <input type="number" class="form-control" id="Operador1" placeholder="Escribe el operador 1">
            </div>
        <!-- Creamos un div el cual se creo un label y un imput los cuales recibiran los valores --> 

            <div class="mb-3">
                <label for="Operador2">Operador 2</label>
                <input type="number" class="form-control" id="Operador2" placeholder="Escribe el operador 2">
            </div>
              <!-- Creamos un div el cual se creo un label y un imput los cuales recibiran los valores --> 
        </form>
        <button class="btn btn-primary mb-3" onclick="sumar()">Sumar</button>
        <div id="resultadoSuma"></div>
          <!-- Creamos el boton el cual a su vez se enlaza con el metodo correspondientes --> 
         <button class="btn btn-primary mb-3" onclick="restar()">Restar</button>
        <div id="resultadoResta"></div>
          <!-- Creamos el boton el cual a su vez se enlaza con el metodo correspondientes --> 
            <button class="btn btn-primary mb-3" onclick="multiplicar()">multiplicar</button>
        <div id="resultadoMulti"></div>
          <!-- Creamos el boton el cual a su vez se enlaza con el metodo correspondientes --> 
            <button class="btn btn-primary mb-3" onclick="dividir()">Dividir</button>
        <div id="resultadoDiv"></div>
          <!-- Creamos el boton el cual a su vez se enlaza con el metodo correspondientes --> 
    </div>
    <br>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>

</body>

</html>

            </ul>

    </div>
<!-- Despues dentro de otro contenedor, hacemos un boton el cual esta enlazado a la funcion agregarPersonas la cual recibe
las personas una vez clickeando el boton. 
-->
    <div class="contenedor">
        <div style="text-align: center;">
            <button style="cursor: pointer" onclick="agregarPersona()">+</button>
        </div>

    <!--Formulario encargado de recibir el nombre y apellido ingresado -->
<form id="formulario">

<input type="text" id="nombre" placeholder="Nombre"/>
<input type="text" id="apellido" placeholder="Apellido"/>

</form>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Formulario</title>
</head>

<body>

<form id="formulario">

  <div class="mb-3">
    <label for="texto1" class="form-label">Ingresa tu nombre</label>
    <input type="text" onfocus="cambiar(this)" onblur="regresar(this)" class="form-control" id="texto1">
   
  </div>

  <div class="mb-3">
    <label for="texto2" class="form-label">Ingresa tu edad</label>
    <input type="number"  onfocus="cambiar(this)" onblur="regresar(this)" class="form-control" id="texto2">
  </div>

  <button type="submit" class="btn btn-primary" onclick="mostrar(event)" onclick="alerta()">Enviar</button>
  <div id="resultado"></div>
</form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
